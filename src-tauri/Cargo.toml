[package]
name = "codex-proxy-launcher"
version = "0.3.3"
description = "macOS and Windows Codex/ChatGPT proxy launcher"
authors = ["yukaige"]
edition = "2021"
license = "MIT"

[lib]
name = "codex_proxy_launcher_lib"
# Desktop binaries only need the Rust library. A cdylib exports the entire
# dependency graph and can exceed the Windows GNU export ordinal limit.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dunce = "1"
arboard = { version = "3", default-features = false }
native-tls = "0.2"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
